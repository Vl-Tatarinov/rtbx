- title: RTBX Cat
  text: Виртуальная служба гражданской ответственности на конфиденциальной блокчейн-технологии.
- title: P2P-проект RTBX
  text: Открытая криптовалюта с открытым исходным кодом. Участники сети — страны-партнёры и граждане. Приватный кошелёк полностью зашифрован и защищён блокчейном.
- title: RTBX Opinion
  text: Социальная сеть в разработке. Граждане предлагают проекты и озвучивают проблемы социальной, корпоративной и административной безопасности. Медиаканал ведут эксперты.
- title: Искусственный интеллект
  text: Алгоритмы отслеживания паттернов общественных эскалаций, потенциальных рисков и угроз — с рекомендациями к действию. Контроль своевременного реагирования на приоритетные обращения.
